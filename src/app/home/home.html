<div class="content">
  <h1 class="visually-hidden">{{ page.heading }}</h1>
  <div class="container-fluid px-4">
    <div class="row">
      <div class="col-3">
        <div class="home-card about-card text-center">
          <div class="row">
            <div class="col-12">
              <img [ngSrc]="profile.ngSrc" [ngSrcset]="profile.ngSrcset" [sizes]="profile.sizes" [width]="profile.width" [height]="profile.height" [loaderParams]="profile.loaderParams" class="zoom" [alt]="profile.alt" priority>
              <br />

              <div class="bio">
                <h3>{{ home.name }}</h3>
                <p>@for (item of home.tagline; track $index) {{{ item }}@if (!$last) {&ngsp;<span class="devider">●</span>&ngsp;}}</p>
                @for (paragraph of home.about; track $index) {
                  <hr />
                  <p>{{ paragraph }}</p>
                }
              </div>
            </div>
          </div>
        </div>
      </div>
      <div class="col-9">
        <div class="row">
          @for (tile of tiles; track $index) {
            <div class="col-4">
              <div class="home-card zoom">
                <a [routerLink]="tile.route" [title]="tile.name">
                  <img [ngSrc]="tile.image.ngSrc" [ngSrcset]="tile.image.ngSrcset" [sizes]="tile.image.sizes" [width]="tile.image.width" [height]="tile.image.height" [loaderParams]="tile.image.loaderParams" [alt]="tile.image.alt" [priority]="$index < 3">
                </a>
              </div>
            </div>
          }
        </div>
      </div>
    </div>
  </div>
</div>
