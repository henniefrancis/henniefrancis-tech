<div class="content">
  <h1 class="visually-hidden">{{ page.heading }}</h1>
  <div class="container-fluid px-4">
    <div class="row">
      <div class="col-3">
        <div class="home-card about-card text-center">
          <div class="row">
            <div class="col-12">
              <img [src]="home.profile.src" class="zoom" [alt]="home.profile.alt">
              <br />

              <div class="bio">
                <h3>{{ home.name }}</h3>
                <p>@for (item of home.tagline; track $index) {{{ item }}@if (!$last) {&ngsp;<span class="devider">●</span>&ngsp;}}</p>
                @for (paragraph of home.about; track $index) {
                  <hr />
                  <p>{{ paragraph }}</p>
                }
              </div>
            </div>
          </div>
        </div>
      </div>
      <div class="col-9">
        <div class="row">
          @for (tile of home.tiles; track $index) {
            <div class="col-4">
              <div class="home-card zoom">
                <a [routerLink]="tile.route" [title]="tile.name">
                  <img [src]="tile.image.src" [alt]="tile.image.alt" loading="lazy">
                </a>
              </div>
            </div>
          }
        </div>
      </div>
    </div>
  </div>
</div>
