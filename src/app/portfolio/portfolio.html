<div class="container-fluid px-4">
  <div class="row">
    <div class="col">
      <nav class="divider-color" style="--bs-breadcrumb-divider: '&#x27A4;';" aria-label="breadcrumb">
        <ol class="breadcrumb">
          <a routerLink="/" title="Go Back" class="back">&#10531;</a>
          <li class="breadcrumb-item root"><a routerLink="/">root@hennie</a><b>: </b></li>
          <li class="breadcrumb-item current" aria-current="page">Portfolio of Evidence</li>
        </ol>
      </nav>
    </div>
  </div>
  <div class="row heading">
    <div class="col"><h1>Portfolio</h1></div>
  </div>
  <div class="row">
    @for (tile of tiles; track $index) {
      <div class="col-4">
        <div class="home-card zoom">
          <a [routerLink]="tile.route" [title]="tile.name">
            <img [src]="tile.src" [alt]="tile.name">
          </a>
        </div>
      </div>
    }
  </div>
</div>
