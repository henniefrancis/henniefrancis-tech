<div class="container-fluid px-4">
  <div class="row">
    <div class="col">
      <nav class="divider-color" style="--bs-breadcrumb-divider: '&#x27A4;';" aria-label="breadcrumb">
        <ol class="breadcrumb">
          <a routerLink="/" title="Go Back" class="back">&#10531;</a>
          <li class="breadcrumb-item root"><a routerLink="/">root@hennie</a><b>: </b></li>
          <li class="breadcrumb-item current" aria-current="page">{{ page.breadcrumb }}</li>
        </ol>
      </nav>
    </div>
  </div>
  <div class="row heading">
    <div class="col"><h1>{{ page.heading }}</h1></div>
  </div>
  <div class="row socials-grid">
    @for (social of socials; track $index) {
      <div class="col-2">
        <div class="socials zoom">
          @if (social.url) {
            <a [href]="social.url" [title]="social.name" target="_blank" rel="noopener noreferrer">
              <img [src]="social.image.src" [alt]="social.image.alt" loading="lazy">
            </a>
          } @else {
            <img [src]="social.image.src" [alt]="social.image.alt" loading="lazy">
          }
        </div>
      </div>
    }
  </div>
</div>
