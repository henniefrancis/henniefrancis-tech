<div class="container-fluid px-4">
  <div class="row">
    <div class="col">
      <nav class="divider-color" style="--bs-breadcrumb-divider: '&#x27A4;';" aria-label="breadcrumb">
        <ol class="breadcrumb">
          <a routerLink="/" title="Go Back" class="back">&#10531;</a>
          <li class="breadcrumb-item root"><a routerLink="/">root@hennie</a><b>: </b></li>
          <li class="breadcrumb-item current" aria-current="page">{{ page.breadcrumb }}</li>
        </ol>
      </nav>
    </div>
  </div>
  <div class="row heading">
    <div class="col"><h1>{{ page.heading }}</h1></div>
  </div>

  @if (role.enabled) {
  @if (role.logo; as logo) {
    <div class="row heading">
      <div class="col">
        <a [href]="logo.url" target="_blank" rel="noopener noreferrer" [title]="logo.image.alt">
          <img [src]="logo.image.src" class="current-role" [alt]="logo.image.alt">
        </a>
      </div>
    </div>
  }

  @for (fact of role.facts; track $index) {
    <div class="row">
      <div class="col-5"></div>
      <div class="col-1"><h5>{{ fact.label }}:</h5></div>
      <div class="col-2"><p>{{ fact.value }}</p></div>
      <div class="col-4"></div>
    </div>
  }
  }
</div>
