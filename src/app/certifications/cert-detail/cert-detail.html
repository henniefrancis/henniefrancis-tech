@if (data(); as d) {
  <div class="container-fluid px-4">
    <div class="row">
      <div class="col">
        <nav class="divider-color" style="--bs-breadcrumb-divider: '&#x27A4;';" aria-label="breadcrumb">
          <ol class="breadcrumb">
            <a routerLink="/certifications" title="Go Back" class="back">&#10531;</a>
            <li class="breadcrumb-item root"><a routerLink="/">root@hennie</a><b>: </b></li>
            <li class="breadcrumb-item"><a routerLink="/certifications">Certifications</a></li>
            <li class="breadcrumb-item">Microsoft</li>
            <li class="breadcrumb-item">{{ typeName() }}</li>
            <li class="breadcrumb-item current" aria-current="page">{{ d.title }}</li>
          </ol>
        </nav>
      </div>
    </div>

    <div class="row text-center">
      <div class="col"><h1>{{ d.title }}</h1></div>
    </div>

    <div class="row text-center">
      <div class="col-3"></div>
      <div class="col-6">
        <div class="certificate zoom">
          <img [src]="d.image" [alt]="d.title">
        </div>
      </div>
      <div class="col-3"></div>
    </div>
  </div>
} @else {
  <div class="container-fluid px-4">
    <div class="row heading"><div class="col"><h1>Certificate not found</h1></div></div>
  </div>
}
