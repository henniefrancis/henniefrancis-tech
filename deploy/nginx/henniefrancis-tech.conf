# ============================================================
# henniefrancis-tech.conf - nginx site config for the origin, v1
#
# Installed by the deploy as /etc/nginx/conf.d/henniefrancis-tech.conf,
# only after `nginx -t` passes (previous config restored otherwise).
# The file is included at http level by /etc/nginx/nginx.conf, so it may
# contain http-level directives (map, log_format).
#
# Requirements on the instance before this file is installed:
#   1. Let's Encrypt certificate for the origin hostname (runbook "Origin
#      certificate"). Without it nginx -t fails and the deploy keeps the
#      previous config.
#   2. /etc/nginx/origin-verify.d/ exists. The deploy renders
#      origin-verify.inc into it from SSM (render-origin-verify.sh). An
#      empty directory is valid: every request then maps to origin_ok=0,
#      which is harmless in log-only mode.
#
# v1 (this file): the origin_ok check is LOG-ONLY. Port 80 keeps serving
# the public names exactly as before, plus ACME, until the DNS cutover
# has settled. v2 (lockdown) enforces the header on 443 and reduces port
# 80 to ACME only.
#
# CACHING:
#   HTML                          no-cache, stale-if-error=86400   (+ ETag)
#   hashed JS/CSS/fonts/images    public, max-age=31536000, immutable
#   everything else               no-cache
# The value comes from one map keyed on the FINAL file ($uri after
# try_files), and is added once at server level. No location adds its
# own add_header, so the security headers are inherited everywhere.
# ============================================================

# Bigger buckets: the origin verify secret is 64 characters, which does
# not fit the default bucket size.
map_hash_bucket_size 128;

# 1 when the X-Origin-Verify header equals the current or previous
# secret. The include holds lines of the form:  "<secret>" 1;
# The wildcard include is valid when no file matches. The header value
# is never logged, only the match flag.
map $http_x_origin_verify $origin_ok {
    default 0;
    include /etc/nginx/origin-verify.d/*.inc;
}

log_format hft_origin '$remote_addr - [$time_local] "$request" '
                      '$status $body_bytes_sent "$http_user_agent" '
                      'origin_ok=$origin_ok';

map $uri $hft_cache_control {
    default "no-cache";
    "~\.html$" "no-cache, stale-if-error=86400";
    "~-[A-Z0-9]{8}\.(?:js|css|woff2?|svg|png|jpe?g|gif|webp|ico)$" "public, max-age=31536000, immutable";
}

# www -> apex on plain HTTP, as before. CloudFront does this at the edge
# for viewers; this block only matters for direct hits on the old record.
server {
    listen 80;
    listen [::]:80;
    server_name www.henniefrancis.tech;

    location ^~ /.well-known/acme-challenge/ {
        alias /var/www/certbot/.well-known/acme-challenge/;
    }

    location / {
        return 301 https://henniefrancis.tech$request_uri;
    }
}

# ── Port 80: public names, as today, plus ACME ────────────────
server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name henniefrancis.tech origin.henniefrancis.tech;

    root /var/www/henniefrancis-tech/html;
    index index.html;

    access_log /var/log/nginx/access.log hft_origin;

    limit_req zone=general burst=30 nodelay;
    # A burst over the limit is a 429, not the default 503 (which would show
    # the "temporarily unavailable" page and count as an origin error).
    limit_req_status 429;

    add_header X-Frame-Options        "SAMEORIGIN"                              always;
    add_header X-Content-Type-Options "nosniff"                                 always;
    add_header Referrer-Policy        "strict-origin-when-cross-origin"         always;
    add_header Permissions-Policy     "camera=(), microphone=(), geolocation=(), payment=(), usb=(), interest-cohort=(), browsing-topics=()" always;
    add_header Cache-Control          $hft_cache_control                        always;

    # A path that starts with // or /\ would turn the relative Location
    # below into a protocol-relative URL (an open redirect to another host).
    # Refuse it before any redirect rule runs. The captures below also
    # cannot start with a slash.
    if ($request_uri ~ "^/[/\x5c]") {
        return 404;
    }

    # Redirects match the raw request line ($request_uri), so a decoded
    # CR or LF can never reach a Location header. They run before
    # location matching, so /404.html and /50x.html are excluded here.
    # Query strings are kept (the captured query is appended). Behind
    # CloudFront this needs the origin request policy that forwards them.
    # Location stays relative: behind CloudFront the Host header is the
    # origin hostname, which must never leak into a redirect.
    absolute_redirect off;

    #   /index.html and /x/index.html  ->  / and /x
    if ($request_uri ~ "^/(?:(?<hft_i1>[^?/][^?]*?)/)?index\.html(?<hft_iq>\?.*)?$") {
        return 301 /$hft_i1$hft_iq;
    }
    #   legacy /pages/x.html  ->  /x
    if ($request_uri ~ "^/pages/(?<hft_p1>[^?/][^?]*)\.html(?<hft_pq>\?.*)?$") {
        return 301 /$hft_p1$hft_pq;
    }
    #   /x.html  ->  /x
    if ($request_uri ~ "^/(?!(?:404|50x)\.html(?:\?|$))(?<hft_h1>[^?/][^?]*)\.html(?<hft_hq>\?.*)?$") {
        return 301 /$hft_h1$hft_hq;
    }
    #   /x/  ->  /x
    if ($request_uri ~ "^/(?<hft_t1>[^?/][^?]*)/(?<hft_tq>\?.*)?$") {
        return 301 /$hft_t1$hft_tq;
    }

    location ^~ /.well-known/acme-challenge/ {
        alias /var/www/certbot/.well-known/acme-challenge/;
    }

    # Styled error pages ship with the site. Not internal: CloudFront
    # fetches /50x.html directly when it serves its own 502/503/504.
    error_page 404 /404.html;
    location = /404.html {
    }

    error_page 500 502 503 504 /50x.html;
    location = /50x.html {
    }

    # Hidden files (.git, .DS_Store ...). ACME above matches first (^~).
    location ~ /\. {
        deny all;
        access_log off;
        log_not_found off;
    }

    # Clean URLs without a directory redirect: /x serves x, x/index.html
    # or x.html. Anything else is a real 404.
    location / {
        try_files $uri $uri/index.html $uri.html =404;
    }
}

# ── Port 443: the CloudFront origin ───────────────────────────
# CloudFront connects to origin.henniefrancis.tech (Host is not
# forwarded), so only this name needs a certificate.
server {
    listen 443 ssl default_server;
    listen [::]:443 ssl default_server;
    server_name origin.henniefrancis.tech;

    ssl_certificate     /etc/letsencrypt/live/origin.henniefrancis.tech/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/origin.henniefrancis.tech/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_session_cache   shared:SSL:2m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    root /var/www/henniefrancis-tech/html;
    index index.html;

    access_log /var/log/nginx/access.log hft_origin;

    # No limit_req here: after the cutover every request comes from a
    # CloudFront edge address, so a per-IP limit would throttle real
    # visitors. CloudFront absorbs bursts.

    # v2 (lockdown) adds here:
    #     if ($origin_ok = 0) { return 403; }
    # v1 only logs origin_ok.

    add_header X-Frame-Options        "SAMEORIGIN"                              always;
    add_header X-Content-Type-Options "nosniff"                                 always;
    add_header Referrer-Policy        "strict-origin-when-cross-origin"         always;
    add_header Permissions-Policy     "camera=(), microphone=(), geolocation=(), payment=(), usb=(), interest-cohort=(), browsing-topics=()" always;
    add_header Cache-Control          $hft_cache_control                        always;

    absolute_redirect off;

    # A path that starts with // or /\ would turn the relative Location
    # below into a protocol-relative URL (an open redirect to another host).
    # Refuse it before any redirect rule runs. The captures below also
    # cannot start with a slash.
    if ($request_uri ~ "^/[/\x5c]") {
        return 404;
    }

    if ($request_uri ~ "^/(?:(?<hft_i1>[^?/][^?]*?)/)?index\.html(?<hft_iq>\?.*)?$") {
        return 301 /$hft_i1$hft_iq;
    }
    if ($request_uri ~ "^/pages/(?<hft_p1>[^?/][^?]*)\.html(?<hft_pq>\?.*)?$") {
        return 301 /$hft_p1$hft_pq;
    }
    if ($request_uri ~ "^/(?!(?:404|50x)\.html(?:\?|$))(?<hft_h1>[^?/][^?]*)\.html(?<hft_hq>\?.*)?$") {
        return 301 /$hft_h1$hft_hq;
    }
    if ($request_uri ~ "^/(?<hft_t1>[^?/][^?]*)/(?<hft_tq>\?.*)?$") {
        return 301 /$hft_t1$hft_tq;
    }

    error_page 404 /404.html;
    location = /404.html {
    }

    error_page 500 502 503 504 /50x.html;
    location = /50x.html {
    }

    location ~ /\. {
        deny all;
        access_log off;
        log_not_found off;
    }

    location / {
        try_files $uri $uri/index.html $uri.html =404;
    }
}
