name: security

# Weekly sweep plus manual runs only. There is no push or PR trigger: the
# per-PR security checks live in the `ci` workflow.

on:
  workflow_dispatch:
  schedule:
    # Mondays 03:00 UTC
    - cron: '0 3 * * 1'

permissions:
  contents: read

jobs:
  security:
    name: security
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout (full history for the date-bounded secret scan)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: |
            package-lock.json
            tools/*/package-lock.json

      - name: Install gitleaks (pinned release, checksum verified)
        run: .github/scripts/install-tool.sh gitleaks

      # Only the last 8 days of commits: enough to cover the weekly cadence
      # with overlap. The full-history scan is run locally at release time.
      - name: Secret scan (gitleaks, last 8 days)
        run: |
          gitleaks git \
            --config .gitleaks.toml \
            --log-opts "--since=8.days" \
            --redact \
            --no-banner \
            --exit-code 1 \
            .

      - name: Dependency audit (runtime dependencies)
        run: |
          set -euo pipefail
          npm ci
          npm audit --omit=dev --audit-level=high
          shopt -s nullglob
          for f in tools/*/package.json; do
            dir="$(dirname "$f")"
            echo "::group::npm audit in ${dir}"
            (cd "$dir" && npm ci && npm audit --omit=dev --audit-level=high)
            echo "::endgroup::"
          done

      - name: Install trivy (pinned release, checksum verified)
        run: .github/scripts/install-tool.sh trivy

      - name: Vulnerability scan (trivy fs)
        run: |
          trivy fs \
            --scanners vuln \
            --severity CRITICAL,HIGH \
            --ignore-unfixed \
            --skip-dirs node_modules \
            --skip-dirs .angular \
            --exit-code 1 \
            .
