name: Lint — henniefrancis.tech

on:
  push:
    branches: [main]
  workflow_call:
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - 'src/**'

permissions:
  contents: read

jobs:
  # ── Angular compile check ────────────────────────────────────
  # The site is an Angular app; the meaningful "lint" is that it
  # compiles — AOT template checking + TypeScript type-checking catch
  # bad bindings, unknown elements, and type errors before deploy.
  compile:
    name: Angular compile check
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 1

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: src/package-lock.json

      - name: Install dependencies
        working-directory: src
        run: npm ci

      - name: Compile (dev build — AOT templates + type check)
        working-directory: src
        run: npx ng build --configuration development
