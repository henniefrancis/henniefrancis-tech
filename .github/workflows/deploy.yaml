name: Deploy to production

# Pipeline: build (or pick a stored artifact) -> upload -> deploy over SSM ->
# nginx config install and reload -> CloudFront invalidation -> smoke checks.
# A prepare job runs before the build: it checks out and validates the content
# and decides whether the live site is already current.
# Deploys use GitHub OIDC only. No AWS keys are stored in GitHub.
#
# Triggers: a push to main (site code), a manual run, and the content
# repository, which starts this workflow on main with workflow_dispatch after
# a validated content change.
#
# Content: the page text lives in a private repository. A GitHub App
# installation token that can only read that repository is minted for the
# prepare and build jobs. The content is validated and turned into data modules
# by tools/content; any error stops the run before anything is deployed.
# Nothing from the content is ever printed to the log.
#
# Skip rule: /version.json on the live site records the site commit and the
# content hash it was built from. When both equal what this run would build,
# the build and deploy are skipped. A manual run with force set deploys anyway.
# If the live file cannot be read, the run deploys.
#
# Quality gates run in the `ci` workflow on the pull request, so they are not
# repeated here.
#
# Environment-specific values come from repository variables:
#   vars.AWS_DEPLOY_ROLE_ARN   IAM role assumed through OIDC
#   vars.AWS_REGION            deployment region
#   vars.ARTIFACTS_BUCKET      artifact store
#   vars.WEB_ROOT              web root on the instance
#   vars.SITE_URL              optional, public URL used for smoke checks
# and one secret: CLOUDFRONT_DISTRIBUTION_ID (optional).
#
# Content access (required for every build; set them as repository settings):
#   vars.CONTENT_APP_CLIENT_ID        Client ID of the GitHub App
#   secrets.CONTENT_APP_PRIVATE_KEY   private key of that App
#
# The target instance is not a variable. It is discovered at deploy time from
# its Name tag, so replacing the instance never leaves this pipeline aiming at
# a dead id.
#
# Artifact layout: a zip with two top-level folders:
#   site/    the web root (prerendered build output plus version.json)
#   nginx/   copied from deploy/nginx/, installed on the instance

on:
  push:
    branches: [main]
    paths-ignore:
      - 'terraform/**'
      - 'e2e/**'
      - '**/*.md'
  workflow_dispatch:
    inputs:
      artifact_version:
        description: 'Rollback: redeploy a stored artifact version (for example 20260101-120000-abc1234) without building. Leave empty to build from this commit.'
        required: false
        default: ''
        type: string
      reason:
        description: 'Why this deploy was started (free text, shown in the run summary)'
        required: false
        default: ''
        type: string
      config_sha:
        description: 'Content commit (40 hex characters) to build with. Empty means the latest main of the content repository. Sent by the content repository.'
        required: false
        default: ''
        type: string
      force:
        description: 'Deploy even if the live site already reports the same site commit and content hash.'
        required: false
        default: false
        type: boolean

# One deploy queue for code and content. Running deploys are never cancelled
# half way; a newer request waits for the current one to finish.
concurrency:
  group: deploy-production
  cancel-in-progress: false

permissions:
  contents: read

env:
  PROJECT_NAME: henniefrancis-tech

jobs:
  # ───────────────────────────────────────────────────────────
  # Stage 0: Prepare (content check and skip decision; not run for a rollback)
  # ───────────────────────────────────────────────────────────

  prepare:
    name: Check content and decide
    if: ${{ github.ref == 'refs/heads/main' && inputs.artifact_version == '' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      skip: ${{ steps.decide.outputs.skip }}
      config_sha: ${{ steps.config.outputs.sha }}
      content_hash: ${{ steps.generate.outputs.content_hash }}
    env:
      SITE_URL: ${{ vars.SITE_URL || 'https://henniefrancis.tech' }}
      REQUESTED_CONFIG_SHA: ${{ inputs.config_sha }}
      FORCE: ${{ inputs.force }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Check the requested content commit
        id: requested
        run: |
          set -euo pipefail
          if [ -z "$REQUESTED_CONFIG_SHA" ]; then
            echo "ref=main" >> "$GITHUB_OUTPUT"
          elif printf '%s' "$REQUESTED_CONFIG_SHA" | grep -Eq '^[0-9a-f]{40}$'; then
            echo "ref=$REQUESTED_CONFIG_SHA" >> "$GITHUB_OUTPUT"
          else
            echo "::error::config_sha must be empty or a full 40 character commit SHA."
            exit 1
          fi

      - name: Check out the content
        id: config
        uses: ./.github/actions/checkout-content
        with:
          client-id: ${{ vars.CONTENT_APP_CLIENT_ID }}
          private-key: ${{ secrets.CONTENT_APP_PRIVATE_KEY }}
          ref: ${{ steps.requested.outputs.ref }}

      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: tools/content/package-lock.json

      # Validates the whole content tree against the schemas and writes the data
      # modules. Fails closed: any problem stops the run. Only the number of
      # routes, the certification counts and the hash are printed.
      - name: Validate the content and compute its hash
        id: generate
        run: |
          set -euo pipefail
          npm ci --ignore-scripts --no-audit --no-fund --prefix tools/content
          node tools/content/generate.mjs
          hash="$(cat src/app/content/generated/content-hash.txt)"
          if ! printf '%s' "$hash" | grep -Eq '^[0-9a-f]{64}$'; then
            echo "::error::The content hash is missing or malformed."
            exit 1
          fi
          echo "content_hash=$hash" >> "$GITHUB_OUTPUT"

      # Compares what this run would build with what the live site reports. Any
      # doubt (no answer, not JSON, fields missing) means deploy.
      - name: Compare with the live site
        id: decide
        env:
          NEW_SITE_SHA: ${{ github.sha }}
          NEW_CONTENT_HASH: ${{ steps.generate.outputs.content_hash }}
          RUN_ID: ${{ github.run_id }}
        run: |
          set -uo pipefail
          skip=false
          live_site_sha=""
          live_hash=""
          if live="$(curl -fsS --max-time 20 --max-redirs 3 -H 'Cache-Control: no-cache' "${SITE_URL%/}/version.json?run=${RUN_ID}")"; then
            live_site_sha="$(jq -r '.siteSha // empty' <<< "$live" 2>/dev/null || true)"
            live_hash="$(jq -r '.contentHash // empty' <<< "$live" 2>/dev/null || true)"
          else
            echo "The live version file could not be read; the run will deploy."
          fi
          if [ -n "$live_site_sha" ] && [ -n "$live_hash" ] \
             && [ "$live_site_sha" = "$NEW_SITE_SHA" ] && [ "$live_hash" = "$NEW_CONTENT_HASH" ]; then
            skip=true
          fi
          if [ "$FORCE" = "true" ]; then
            skip=false
          fi
          echo "skip=$skip" >> "$GITHUB_OUTPUT"
          {
            echo "### Content check"
            echo "- Site commit: \`${NEW_SITE_SHA::7}\`"
            echo "- Content hash: \`${NEW_CONTENT_HASH::12}\`"
            if [ "$skip" = "true" ]; then
              echo "- Result: the live site already runs this commit and this content. Nothing to deploy."
            else
              echo "- Result: deploying."
            fi
          } >> "$GITHUB_STEP_SUMMARY"

  # ───────────────────────────────────────────────────────────
  # Stage 1: Build and package (skipped for a rollback and when nothing changed)
  # ───────────────────────────────────────────────────────────

  build:
    name: Build application
    needs: prepare
    if: ${{ github.ref == 'refs/heads/main' && inputs.artifact_version == '' && needs.prepare.result == 'success' && needs.prepare.outputs.skip != 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    outputs:
      build_key: ${{ steps.version.outputs.build_key }}
    env:
      CONFIG_SHA: ${{ needs.prepare.outputs.config_sha }}
      CONTENT_HASH: ${{ needs.prepare.outputs.content_hash }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          persist-credentials: false

      # The exact content commit that was validated in the prepare job.
      - name: Check out the content
        uses: ./.github/actions/checkout-content
        with:
          client-id: ${{ vars.CONTENT_APP_CLIENT_ID }}
          private-key: ${{ secrets.CONTENT_APP_PRIVATE_KEY }}
          ref: ${{ needs.prepare.outputs.config_sha }}

      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: |
            package-lock.json
            tools/*/package-lock.json

      # npm run build validates the content again and writes the data modules
      # (prebuild), builds, prerenders and writes the script policy into every
      # page (postbuild); the last line checks the policy.
      - name: Install and build (Angular, prerendered)
        run: |
          set -euo pipefail
          npm ci
          shopt -s nullglob
          for f in tools/*/package.json; do
            (cd "$(dirname "$f")" && npm ci --ignore-scripts --no-audit --no-fund)
          done
          npm run build
          node tools/csp/cli.mjs --check "dist/${PROJECT_NAME}/browser"

      # The build must have used the content that was checked in the prepare
      # job. A mismatch means the config moved or the checkout is wrong.
      - name: Check that the build used the validated content
        run: |
          set -euo pipefail
          built="$(cat src/app/content/generated/content-hash.txt)"
          if [ "$built" != "$CONTENT_HASH" ]; then
            echo "::error::The built content does not match the content that was validated."
            exit 1
          fi

      # Written into the web root so the live site can report what it is
      # running. buildKey joins the site commit and the content hash.
      - name: Write version.json
        id: version
        run: |
          set -euo pipefail
          site_dir="dist/${PROJECT_NAME}/browser"
          build_key="${GITHUB_SHA}:${CONTENT_HASH}"
          jq -n \
            --arg siteSha "$GITHUB_SHA" \
            --arg contentHash "$CONTENT_HASH" \
            --arg configSha "$CONFIG_SHA" \
            --arg buildKey "$build_key" \
            --arg builtAt "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            '{siteSha: $siteSha, contentHash: $contentHash, configSha: $configSha, buildKey: $buildKey, builtAt: $builtAt}' \
            > "${site_dir}/version.json"
          echo "build_key=$build_key" >> "$GITHUB_OUTPUT"

      - name: Package artifact (site/ and nginx/)
        run: |
          set -euo pipefail
          stage="${RUNNER_TEMP}/stage"
          rm -rf "$stage"
          mkdir -p "${stage}/site" "${stage}/nginx"
          cp -a "dist/${PROJECT_NAME}/browser/." "${stage}/site/"
          shopt -s nullglob
          confs=(deploy/nginx/*.conf)
          if [ "${#confs[@]}" -gt 0 ]; then
            cp -a "${confs[@]}" "${stage}/nginx/"
            # Rendered on the instance before nginx -t. The test script is not shipped.
            cp -a deploy/nginx/render-origin-verify.sh "${stage}/nginx/"
          else
            echo "::warning::deploy/nginx/*.conf not found; the artifact carries no nginx config."
          fi
          (cd "$stage" && zip -qr "${GITHUB_WORKSPACE}/${PROJECT_NAME}.zip" . -x "*.DS_Store")
          unzip -l "${PROJECT_NAME}.zip" | tail -n 3

      - name: Upload artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ env.PROJECT_NAME }}
          path: ${{ env.PROJECT_NAME }}.zip
          retention-days: 1

  # ───────────────────────────────────────────────────────────
  # Stage 2: Deploy (S3 upload, EC2 over SSM, nginx, CloudFront)
  # ───────────────────────────────────────────────────────────

  deployment:
    name: Application deployment
    needs: [prepare, build]
    # Run after a successful build, or for a rollback (no build). Never after a
    # failed or cancelled job, never when the prepare job found nothing to
    # deploy (the build is skipped then and this is not a rollback), and only
    # from main.
    if: ${{ !cancelled() && github.ref == 'refs/heads/main' && (needs.build.result == 'success' || (inputs.artifact_version != '' && needs.build.result == 'skipped')) }}
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    environment: production   # deployment protection rules and OIDC subject claim
    permissions:
      contents: read
      id-token: write         # OIDC credential exchange with AWS
    env:
      AWS_REGION: ${{ vars.AWS_REGION }}
      ARTIFACTS_BUCKET: ${{ vars.ARTIFACTS_BUCKET }}
      WEB_ROOT: ${{ vars.WEB_ROOT }}
      DEPLOY_ROLE_ARN: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
      SITE_URL: ${{ vars.SITE_URL || 'https://henniefrancis.tech' }}
      ARTIFACT_VERSION: ${{ inputs.artifact_version }}
      EXPECTED_BUILD_KEY: ${{ needs.build.outputs.build_key }}
      DEPLOY_REASON: ${{ inputs.reason }}
      CLOUDFRONT_DISTRIBUTION_ID: ${{ secrets.CLOUDFRONT_DISTRIBUTION_ID }}
    steps:
      - name: Checkout (deploy scripts only)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          persist-credentials: false
          sparse-checkout: .github/scripts

      - name: Preflight, required configuration present
        run: |
          missing=0
          for v in AWS_REGION ARTIFACTS_BUCKET WEB_ROOT DEPLOY_ROLE_ARN; do
            if [ -z "${!v}" ]; then
              echo "::error::Repository variable behind '$v' is not set."
              missing=1
            fi
          done
          if [ -n "$ARTIFACT_VERSION" ] && ! [[ "$ARTIFACT_VERSION" =~ ^[0-9]{8}-[0-9]{6}-[0-9a-f]{7}$ ]]; then
            echo "::error::artifact_version must look like 20260101-120000-abc1234."
            missing=1
          fi
          exit $missing

      - name: Run summary
        run: |
          {
            echo "### Deploy request"
            echo "- Commit: \`${GITHUB_SHA::7}\`"
            if [ -n "$ARTIFACT_VERSION" ]; then
              echo "- Mode: rollback to stored artifact \`${ARTIFACT_VERSION}\`"
            else
              echo "- Mode: build from this commit"
            fi
            if [ -n "$DEPLOY_REASON" ]; then
              echo "- Reason: ${DEPLOY_REASON//[^A-Za-z0-9 ._,:;()-]/}"
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      # Discover the target instance by its Name tag rather than a pinned id:
      # after a Terraform replace the id changes, and a stale id variable would
      # strand deploys. Needs the deploy role's instance discovery statement.
      - name: Resolve target instance
        run: |
          INSTANCE_ID=$(aws ec2 describe-instances \
            --filters "Name=tag:Name,Values=*-${PROJECT_NAME}-ec2" \
                      "Name=instance-state-name,Values=running" \
            --query "Reservations[].Instances[].InstanceId" \
            --output text)
          if [ -z "$INSTANCE_ID" ] || [ "$INSTANCE_ID" = "None" ]; then
            echo "::error::No running instance found with Name tag *-${PROJECT_NAME}-ec2"
            exit 1
          fi
          if [ "$(echo "$INSTANCE_ID" | wc -w)" -ne 1 ]; then
            echo "::error::Expected exactly one running instance."
            exit 1
          fi
          echo "Target instance resolved."
          echo "INSTANCE_ID=$INSTANCE_ID" >> "$GITHUB_ENV"

      - name: Download artifact
        if: ${{ inputs.artifact_version == '' }}
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: ${{ env.PROJECT_NAME }}

      # Build mode: store the zip under a new version. Rollback mode: confirm
      # the requested version exists. Either way the chosen key is exported.
      - name: Select artifact in S3
        run: |
          set -euo pipefail
          if [ -n "$ARTIFACT_VERSION" ]; then
            VERSION="$ARTIFACT_VERSION"
            aws s3api head-object \
              --bucket "$ARTIFACTS_BUCKET" \
              --key "${PROJECT_NAME}/${VERSION}/${PROJECT_NAME}.zip" > /dev/null
            echo "Rolling back to stored version ${VERSION}"
          else
            VERSION="$(date +%Y%m%d-%H%M%S)-${GITHUB_SHA::7}"
            aws s3 cp "${PROJECT_NAME}.zip" \
              "s3://${ARTIFACTS_BUCKET}/${PROJECT_NAME}/${VERSION}/${PROJECT_NAME}.zip"
            aws s3 cp "${PROJECT_NAME}.zip" \
              "s3://${ARTIFACTS_BUCKET}/${PROJECT_NAME}/latest/${PROJECT_NAME}.zip"
            echo "Uploaded version ${VERSION}"
          fi
          echo "ARTIFACT_KEY=${PROJECT_NAME}/${VERSION}/${PROJECT_NAME}.zip" >> "$GITHUB_ENV"
          echo "- Artifact version: \`${VERSION}\`" >> "$GITHUB_STEP_SUMMARY"

      # Run commands on the instance via SSM and FAIL THE JOB unless they
      # succeed on the box.
      #
      # The workdir is /var/tmp (disk backed), not /tmp, which is a small tmpfs
      # on this instance size. The zip is fetched with curl from a presigned
      # URL rather than the AWS CLI on the box: the CLI's memory footprint made
      # the SSM command hang on a nano instance.
      - name: Deploy to EC2
        run: |
          set -euo pipefail
          run_ssm() {
            local comment="$1"; shift
            local params
            params=$(jq -cn --args '{commands: $ARGS.positional}' "$@")
            local cmd_id
            cmd_id=$(aws ssm send-command \
              --instance-ids "$INSTANCE_ID" \
              --document-name "AWS-RunShellScript" \
              --comment "$comment" \
              --parameters "$params" \
              --query "Command.CommandId" \
              --output text)
            echo "SSM command id: $cmd_id ($comment)"

            # Poll until the command leaves Pending/InProgress (up to 10 min).
            # `aws ssm wait command-executed` gives up after about 100 s.
            local status
            for _ in $(seq 1 60); do
              status=$(aws ssm get-command-invocation \
                --command-id "$cmd_id" --instance-id "$INSTANCE_ID" \
                --query "StatusDetails" --output text 2>/dev/null || echo "Pending")
              case "$status" in
                Pending|InProgress|Delayed) sleep 10 ;;
                *) break ;;
              esac
            done
            echo "Status: $status"
            if [ "$status" != "Success" ]; then
              echo "::group::Instance stdout"
              aws ssm get-command-invocation \
                --command-id "$cmd_id" --instance-id "$INSTANCE_ID" \
                --query "StandardOutputContent" --output text
              echo "::endgroup::"
              echo "::group::Instance stderr"
              aws ssm get-command-invocation \
                --command-id "$cmd_id" --instance-id "$INSTANCE_ID" \
                --query "StandardErrorContent" --output text
              echo "::endgroup::"
              return 1
            fi
          }

          PRESIGNED_URL=$(aws s3 presign \
            "s3://${ARTIFACTS_BUCKET}/${ARTIFACT_KEY}" \
            --expires-in 1800)

          # The nginx install script is shipped inline (base64)
          # so the instance needs no repository checkout.
          INSTALL_SCRIPT_B64=$(base64 -w0 .github/scripts/install-nginx-conf.sh)
          DEPLOY_DIR="/var/tmp/${PROJECT_NAME}-deploy"

          # Order: web files, then render the origin-verify include from the
          # parameter store (instance role, secret never printed), then the
          # nginx config. install-nginx-conf.sh runs `nginx -t` against the
          # rendered file, restores the previous config if it fails, and
          # reloads nginx when it passes.
          run_ssm "deploy ${PROJECT_NAME} ${GITHUB_SHA::7}" \
            "set -euo pipefail" \
            "curl -fsS \"${PRESIGNED_URL}\" -o /var/tmp/${PROJECT_NAME}.zip" \
            "rm -rf ${DEPLOY_DIR}" \
            "unzip -o /var/tmp/${PROJECT_NAME}.zip -d ${DEPLOY_DIR}" \
            "test -d ${DEPLOY_DIR}/site || { echo 'artifact has no site/ folder (built before the current layout)' >&2; exit 1; }" \
            "rsync -a --delete ${DEPLOY_DIR}/site/ ${WEB_ROOT}/" \
            "chown -R nginx:nginx ${WEB_ROOT}" \
            "if [ -f ${DEPLOY_DIR}/nginx/render-origin-verify.sh ]; then AWS_REGION=${AWS_REGION} bash ${DEPLOY_DIR}/nginx/render-origin-verify.sh; fi"             "echo ${INSTALL_SCRIPT_B64} | base64 -d > ${DEPLOY_DIR}/install-nginx-conf.sh" \
            "bash ${DEPLOY_DIR}/install-nginx-conf.sh ${DEPLOY_DIR}/nginx" \
            "rm -rf /var/tmp/${PROJECT_NAME}.zip ${DEPLOY_DIR}"

      # Keeps CSS and JS updates instant; HTML is no-cache at the origin.
      - name: Invalidate CloudFront cache
        run: |
          if [ -z "$CLOUDFRONT_DISTRIBUTION_ID" ]; then
            echo "No CLOUDFRONT_DISTRIBUTION_ID secret set, skipping."
            exit 0
          fi
          INVALIDATION_ID=$(aws cloudfront create-invalidation \
            --distribution-id "$CLOUDFRONT_DISTRIBUTION_ID" \
            --paths "/*" \
            --query "Invalidation.Id" \
            --output text)
          echo "Created invalidation: $INVALIDATION_ID"
          aws cloudfront wait invalidation-completed \
            --distribution-id "$CLOUDFRONT_DISTRIBUTION_ID" \
            --id "$INVALIDATION_ID"
          echo "CloudFront invalidation complete."

      # Redirects are followed so this also passes while the origin still
      # redirects directory URLs; the final response must be 200.
      - name: Post-deploy smoke check
        run: |
          set -euo pipefail
          base="${SITE_URL%/}"
          failed=0
          for path in / /biography /public-speaking /certifications /version.json; do
            code=000
            for _ in 1 2 3; do
              code=$(curl -sSL --max-redirs 3 --max-time 20 -o /dev/null -w '%{http_code}' "${base}${path}" || echo 000)
              [ "$code" = "200" ] && break
              sleep 5
            done
            echo "${path} -> ${code}"
            [ "$code" = "200" ] || failed=1
          done
          # A build (not a rollback) must now be what the live site reports.
          if [ -n "$EXPECTED_BUILD_KEY" ]; then
            live_key=""
            for _ in 1 2 3 4 5 6; do
              live_key="$(curl -fsSL --max-time 20 "${base}/version.json?check=${GITHUB_RUN_ID}" | jq -r '.buildKey // empty' 2>/dev/null || true)"
              [ "$live_key" = "$EXPECTED_BUILD_KEY" ] && break
              sleep 10
            done
            if [ "$live_key" = "$EXPECTED_BUILD_KEY" ]; then
              echo "version.json -> matches this build"
            else
              echo "::error::The live version.json does not report this build."
              failed=1
            fi
          fi
          exit $failed

      - name: Update deployment badge
        if: always()
        continue-on-error: true
        env:
          GIST_SECRET: ${{ secrets.GIST_SECRET }}
          GIST_ID: ${{ secrets.DEPLOY_BADGE_GIST_ID }}
          JOB_STATUS: ${{ job.status }}
        run: |
          if [ -z "$GIST_ID" ] || [ -z "$GIST_SECRET" ]; then
            echo "Badge gist not configured, skipping."
            exit 0
          fi
          python3 - << 'PYEOF'
          import json, urllib.request, os
          try:
            passed = os.environ.get("JOB_STATUS") == "success"
            content = json.dumps({
              "schemaVersion": 1,
              "label": "Deploy",
              "message": "Deployed" if passed else "Failed",
              "color": "brightgreen" if passed else "red"
            })
            body = json.dumps({"files": {"henniefrancis-tech-deploy-badge.json": {"content": content}}}).encode()
            req = urllib.request.Request(
              f"https://api.github.com/gists/{os.environ['GIST_ID']}",
              data=body, method="PATCH")
            req.add_header("Authorization", f"Bearer {os.environ['GIST_SECRET']}")
            req.add_header("Content-Type", "application/json")
            urllib.request.urlopen(req)
            print("Deploy badge updated")
          except Exception as e:
            print(f"::warning::Deploy badge skipped: {e}")
          PYEOF
